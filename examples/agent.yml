apiVersion: vesper/v1
kind: Agent

name: researcher
model: gpt-4o
entryPoint: src/agent.py       # Optional - used only in CLI to load the @vesper.agent decorator

tools:
  - web_search
  - read_file

memory:
  scope: project
  retentionDays: 30
  strategy: summarise_on_overflow

budget:
  maxCostPerRun: 0.05
  alertAt: 0.04

guardrails: story-policy

eval:
  dataset: eval/agent.json
  passThreshold: 0.85
  ciGate: true