apiVersion: vesper/v1
kind: Agent

name: researcher
model: gemini-1.5-pro
entryPoint: src/agent.py       # Optional - used only in CLI to load the @vesper.tool decorator

tools:
  - web_search
  - read_file

memory:
  scope: project
  retentionDays: 30
  strategy: summarise_on_overflow

budget:
  maxCostPerRun: 0.05
  alertAt: 0.04
