apiVersion: vesper/v1
kind: Agent

name: researcher
model: gpt-4o-mini
entryPoint: examples/agent.py       # Optional - loads the @vesper.tool functions from this file

tools:
  - web_search                      # built-in
  - get_stock_price                 # custom, from entryPoint

memory:
  scope: project
  retentionDays: 30

budget:
  maxCostPerRun: 0.05
  alertAt: 0.04
