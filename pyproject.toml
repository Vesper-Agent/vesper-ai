[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper"
version = "1.0.0" 
description = "Infrastructure for managing AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mohammed Tahir Siddique"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psycopg[binary]>=3.1.0",
    "PyYAML>=6.0.1",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vesper = "vesper.cli:app"

[tool.setuptools.package-data]
vesper = ["model_costs.json"]